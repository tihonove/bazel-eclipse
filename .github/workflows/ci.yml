name: CI

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
    
on:
  push:
    branches:
      - 'main'
      - 'tihonove/bazel9'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
      - 'tihonove/bazel9'
  workflow_dispatch:
  
permissions: {}

jobs:
  build-and-test:
    name: Build and Test (OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # fork: Linux only (upstream also had macos-latest)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Time for BUILD_ID
        id: time
        uses: nanzm/get-time-action@v2.0
        with:
          format: "YYYYMMDD_HHmm"

      - name: Get Branch name for BUILD_LABEL
        id: branch_name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # Fork: aspects-1e99c4.zip is committed (patched for Bazel 9, with prebuilt
      # aspect tools), because import-and-build.sh can no longer build it:
      # //aspect:aspect_tools depends on a removed IntelliJ EAP snapshot (404).

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Build and Test
        uses: coactions/setup-xvfb@v1
        env:
          BUILD_ID: "${{ steps.time.outputs.time }}"
          BUILD_TYPE: "S"
          BUILD_LABEL: "CI ${{ steps.time.outputs.time }} (${{ steps.branch_name.outputs.branch }})"
        with:
          shell: bash
          run: ./mvnw --batch-mode --no-transfer-progress --strict-checksums --fail-at-end -update-snapshots --show-version --errors clean verify
          
      # Fork: the VS Code extension ships exactly these bundles; fail early if one is
      # missing or Velocity still cannot resolve against slf4j 2.x.
      - name: Check p2 Repository for the VS Code extension
        shell: bash
        run: |
          cd releng/p2repository/target/repository/plugins
          for b in com.github.ben-manes.caffeine com.google.protobuf com.salesforce.bazel.eclipse.core \
                   com.salesforce.bazel.eclipse.jdtls com.salesforce.bazel.importedsource com.salesforce.bazel.sdk \
                   org.apache.velocity.engine-core org.eclipse.equinox.event org.fusesource.jansi org.jsr-305 \
                   org.osgi.service.event; do
            ls ${b}_*.jar >/dev/null 2>&1 || { echo "::error::missing bundle $b"; exit 1; }
          done
          unzip -p org.apache.velocity.engine-core_*.jar META-INF/MANIFEST.MF | tr -d '\r' | sed -e ':a;N;$!ba;s/\n //g' \
            | grep -q 'org.slf4j;version="\[1.7,3)"' || { echo "::error::velocity slf4j range not widened"; exit 1; }

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/**/target/surefire-reports/*.xml

      - name: Upload p2 Repository
        uses: actions/upload-artifact@v4
        if: success() && matrix.os == 'ubuntu-latest'
        with:
          name: p2-repository
          path: releng/p2repository/target/repository/
          if-no-files-found: error

      - name: Upload Products
        uses: actions/upload-artifact@v4
        if: success() && matrix.os == 'ubuntu-latest'
        with:
          name: products
          path: |
            releng/products/scip-bazel-ls/target/products/*.tar.gz
            releng/products/scip-bazel-ls/target/products/*.zip
            releng/products/jdt-bazel-ls/target/products/*.tar.gz
            releng/products/jdt-bazel-ls/target/products/*.zip
          if-no-files-found: error
            
  # Fork: a version tag (v1.4.6, ...) publishes the p2 repository as a GitHub
  # Release, so the VS Code extension can pin its server jars to a version.
  release:
    name: GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download p2 Repository
        uses: actions/download-artifact@v4
        with:
          name: p2-repository
          path: p2-repository

      - name: Zip p2 Repository
        run: cd p2-repository && zip -qr ../p2-repository.zip .

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" p2-repository.zip
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes

  event_file:
    name: "Event File" 
    runs-on: ubuntu-latest
    
    # needed for publishing test results from forks
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ci-event-file
          path: ${{ github.event_path }}
